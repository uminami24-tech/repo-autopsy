[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-autopsy"
version = "0.1.0"
description = "公開 GitHub リポジトリの URL から日本語の Mac 向け検証レポートを自動生成する CLI ツール"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
]

[project.scripts]
autopsy = "repo_autopsy.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_autopsy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
]
